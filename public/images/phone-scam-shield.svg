<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <rect width="800" height="600" fill="#f0f9ff"/>
  <!-- Shield Background -->
  <path d="M400 100 L550 150 L550 350 C550 450 400 500 400 500 C400 500 250 450 250 350 L250 150 Z" fill="#e0f2fe" stroke="#0284c7" stroke-width="8"/>
  <!-- Phone outline -->
  <rect x="340" y="200" width="120" height="200" rx="15" fill="#ffffff" stroke="#0284c7" stroke-width="6"/>
  <!-- Phone screen -->
  <rect x="350" y="220" width="100" height="150" fill="#f1f5f9"/>
  <!-- Alert icon on phone screen -->
  <path d="M400 240 L430 300 L370 300 Z" fill="#ef4444"/>
  <rect x="396" y="260" width="8" height="20" fill="#ffffff"/>
  <circle cx="400" cy="290" r="4" fill="#ffffff"/>
  <!-- Text SCAM on phone screen -->
  <text x="400" y="340" font-family="system-ui, sans-serif" font-size="20" font-weight="bold" fill="#ef4444" text-anchor="middle">SCAM</text>
  <!-- Connection lines -->
  <path d="M150 200 C250 150 300 250 330 250" fill="none" stroke="#ef4444" stroke-width="4" stroke-dasharray="10 10"/>
  <circle cx="150" cy="200" r="20" fill="#ef4444"/>
  <path d="M140 190 L160 210 M160 190 L140 210" stroke="#ffffff" stroke-width="4"/>
</svg>